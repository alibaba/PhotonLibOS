name: macOS-matrix

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Draft PRs don't run CI. Auto-PR opens conflicted backports as drafts, whose conflict
# markers would fail the build anyway; marking one ready for review triggers a full run
# against a freshly computed merge ref.
on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "main", "release/*" ]

jobs:
  macOS14-arm:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-14

    steps:
      - uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Shanghai"
          timezoneMacos: "Asia/Shanghai"
          timezoneWindows: "China Standard Time"

      - uses: actions/checkout@v3

      - name: Install Dependencies
        shell: bash
        run: |
          brew install cmake openssl gflags googletest gsasl

      - name: Build
        run: |
          cmake -B ${{github.workspace}}/build -D PHOTON_BUILD_TESTING=ON -D CMAKE_BUILD_TYPE=Debug \
            -D PHOTON_ENABLE_SASL=ON -DOPENSSL_ROOT_DIR=/usr/local/opt/openssl@3
          cmake --build ${{github.workspace}}/build -j -- VERBOSE=1

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest --timeout 3600 -V
