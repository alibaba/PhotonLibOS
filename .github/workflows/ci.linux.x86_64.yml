name: Linux x86_64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Draft PRs don't run CI. Auto-PR opens conflicted backports as drafts, whose conflict
# markers would fail the build anyway; marking one ready for review triggers a full run
# against a freshly computed merge ref.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "main", "release/*" ]

jobs:
  gcc-test:
    name: gcc-${{ matrix.gcc }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: arc-acs-runner-set
    strategy:
      fail-fast: false
      matrix:
        gcc: [8, 9, 10, 11, 12, 13, 14]
    steps:
      - uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Shanghai"
          timezoneMacos: "Asia/Shanghai"
          timezoneWindows: "China Standard Time"
      - uses: actions/checkout@v4
      - name: Build
        run: |
          uname -a
          if [ "${{ matrix.gcc }}" != "8" ]; then
            source /opt/rh/gcc-toolset-${{ matrix.gcc }}/enable
          fi
          cmake -B build -D CMAKE_BUILD_TYPE=MinSizeRel   \
                         -D PHOTON_ENABLE_ECOSYSTEM=ON    \
                         -D PHOTON_BUILD_TESTING=ON       \
                         -D PHOTON_ENABLE_SASL=ON         \
                         -D PHOTON_ENABLE_FUSE=ON         \
                         -D PHOTON_ENABLE_URING=ON        \
                         -D PHOTON_ENABLE_LIBCURL=ON      \
                         -D PHOTON_ENABLE_KCP=ON          \
                         -D PHOTON_ENABLE_EXTFS=ON
          cmake --build build -j $(nproc)
      - name: Test epoll
        run: |
          nohup redis-server &
          cd build && ctest --timeout 3600 -V
          pkill redis-server
      - name: Test io_uring
        run: |
          nohup redis-server &
          export PHOTON_CI_EV_ENGINE=io_uring
          cd build && ctest --timeout 3600 -V
          pkill redis-server
      - name: Test epoll_ng
        run: |
          nohup redis-server &
          export PHOTON_CI_EV_ENGINE=epoll_ng
          cd build && ctest --timeout 3600 -V
          pkill redis-server

  # PROBE, not a test -- remove once it has answered.
  #
  # Question: can a privileged container on a GitHub-hosted runner reach the three
  # kernel transports whose suites the gcc-test job above skips entirely? It cannot
  # today, for two independent reasons. The arc-acs-runner-set pods are unprivileged
  # (values.yaml's pod spec sets no securityContext, and the job log shows the
  # Docker-default 63 MB /dev/shm), and their node kernel is 5.10.134-*.lifsea8,
  # which predates ublk (mainline 6.0) and vduse (5.15) outright -- so no uid can
  # load a module the kernel does not have. That is why 104 of the blk cases print
  # "requires root" and verify nothing.
  #
  # This job is the cheapest way to find out whether a different runner can: same
  # image the arc runners are built from, but on a GitHub-hosted VM with
  # --privileged, which is what the fstack and RocksDB jobs below already use.
  # Every command is `|| true` and the step always exits 0, so a missing module
  # cannot turn CI red -- the answer is in the log, not in the conclusion.
  blk-kernel-probe:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/alibaba/photon-ut-base:latest
      options: --cpus 4 --privileged
    steps:
      - name: Probe
        run: |
          # GitHub runs this with `bash -e`; the whole point is that nothing here
          # may fail the job, so the answer has to be read rather than inferred
          # from a red X.
          set +e
          echo "== who am i =="
          id
          uname -r
          echo "== module tree visible? =="
          ls -d /lib/modules/* 2>&1
          command -v modprobe >/dev/null || dnf install -y kmod
          echo "== can each transport be loaded, and does its node appear? =="
          for m in ublk_drv vduse target_core_user tcm_loop; do
            out=$(modprobe "$m" 2>&1); rc=$?
            echo "  modprobe $m: rc=$rc loaded=$(lsmod | grep -c "^$m ") ${out:+-- $out}"
          done
          ls -l /dev/ublk-control /dev/vduse/control /dev/uio0 2>&1
          echo "== tcmu's configfs =="
          ls -d /sys/kernel/config/target 2>&1
          echo "== vduse's consumer tool (the suite skips without it) =="
          command -v vdpa 2>&1
          echo "== /dev/shm, which other suites already skip on =="
          df -h /dev/shm 2>&1
          exit 0

  fstack:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/alibaba/photon-ut-fstack:latest
      options: --cpus 4 --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -D CMAKE_BUILD_TYPE=MinSizeRel \
            -D PHOTON_BUILD_TESTING=ON \
            -D PHOTON_ENABLE_FSTACK_DPDK=ON
          cmake --build build -j $(nproc) -t fstack-dpdk-demo

  RocksDB:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    container:
      image: almalinux:8
      options: --cpus 4 --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          export PHOTON_SRC_DIR=`pwd`
          dnf install -q -y git gcc-c++ cmake openssl-devel libcurl-devel libaio-devel zlib-devel epel-release
          dnf config-manager --set-enabled powertools
          dnf install -q -y gflags-devel snappy-devel zlib-devel bzip2-devel lz4-devel libzstd-devel nasm
          git clone -b photon-on-6.1.2 https://github.com/data-accelerator/rocksdb.git /opt/rocksdb
          cd /opt/rocksdb
          rm -rf third-party/PhotonLibOS
          ln -s $PHOTON_SRC_DIR third-party/PhotonLibOS
          ./photon-auto-convert.sh
          cmake -B build -D WITH_TESTS=on -D INIT_PHOTON_IN_ENV=on -D WITH_LZ4=on -D WITH_SNAPPY=on \
            -D CMAKE_BUILD_TYPE=Debug
          cmake --build build -j `nproc`
