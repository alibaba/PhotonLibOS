name: Linux x86_64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Draft PRs don't run CI. Auto-PR opens conflicted backports as drafts, whose conflict
# markers would fail the build anyway; marking one ready for review triggers a full run
# against a freshly computed merge ref.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "main", "release/*" ]

jobs:
  gcc-test:
    name: gcc-${{ matrix.gcc }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: arc-acs-runner-set
    strategy:
      fail-fast: false
      matrix:
        gcc: [8, 9, 10, 11, 12, 13, 14]
    steps:
      - uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Shanghai"
          timezoneMacos: "Asia/Shanghai"
          timezoneWindows: "China Standard Time"
      - uses: actions/checkout@v4
      - name: Build
        run: |
          uname -a
          if [ "${{ matrix.gcc }}" != "8" ]; then
            source /opt/rh/gcc-toolset-${{ matrix.gcc }}/enable
          fi
          cmake -B build -D CMAKE_BUILD_TYPE=MinSizeRel   \
                         -D PHOTON_ENABLE_ECOSYSTEM=ON    \
                         -D PHOTON_BUILD_TESTING=ON       \
                         -D PHOTON_ENABLE_SASL=ON         \
                         -D PHOTON_ENABLE_FUSE=ON         \
                         -D PHOTON_ENABLE_URING=ON        \
                         -D PHOTON_ENABLE_LIBCURL=ON      \
                         -D PHOTON_ENABLE_KCP=ON          \
                         -D PHOTON_ENABLE_EXTFS=ON
          cmake --build build -j $(nproc)
      # tcmu, ublk and vduse gate every case on a kernel-side prerequisite and skip when
      # it is missing. The skip is a log line -- gtest is never told -- so ctest reports
      # those cases as passed while they did nothing. Load the modules and print what
      # actually came up. Not fatal: an image without them still runs the other ~230
      # cases, and the warning below says so when none of the three came up.
      - name: Load kernel modules for tcmu / ublk / vduse
        run: |
          for m in ublk_drv vduse virtio_vdpa target_core_mod target_core_user tcm_loop; do
            sudo modprobe "$m" 2>/dev/null && echo "ok      $m" || echo "MISSING $m"
          done
          grep -q ' /sys/kernel/config ' /proc/mounts ||
            sudo mount -t configfs none /sys/kernel/config || true
          echo "--- prerequisites the blk suites check ---"
          ls -l /dev/ublk-control /dev/vduse/control 2>&1 || true
          ls -d /sys/kernel/config/target/core 2>&1 || true
          if command -v vdpa >/dev/null; then echo "present vdpa tool"
          elif sudo dnf install -q -y iproute >/dev/null 2>&1; then echo "installed vdpa tool"
          else echo "MISSING vdpa tool"; fi
          n=0
          [ -e /dev/ublk-control ] && n=$((n+1)) || true
          [ -e /dev/vduse/control ] && n=$((n+1)) || true
          [ -d /sys/kernel/config/target/core ] && n=$((n+1)) || true
          echo "prerequisites present: $n/3"
          if [ "$n" -eq 0 ]; then
            echo "::warning::no privileged blk transport came up; tcmu, ublk and vduse cases will be counted as passed without running"
          fi
      - name: Test epoll
        run: |
          nohup redis-server &
          cd build && ctest --timeout 3600 -V
          pkill redis-server
      - name: Test io_uring
        run: |
          nohup redis-server &
          export PHOTON_CI_EV_ENGINE=io_uring
          cd build && ctest --timeout 3600 -V
          pkill redis-server
      - name: Test epoll_ng
        run: |
          nohup redis-server &
          export PHOTON_CI_EV_ENGINE=epoll_ng
          cd build && ctest --timeout 3600 -V
          pkill redis-server

  fstack:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: photon-arc-runner-fstack
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -D CMAKE_BUILD_TYPE=MinSizeRel \
            -D PHOTON_BUILD_TESTING=ON \
            -D PHOTON_ENABLE_FSTACK_DPDK=ON
          cmake --build build -j $(nproc) -t fstack-dpdk-demo

  RocksDB:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: arc-acs-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          export PHOTON_SRC_DIR="$(pwd)"
          sudo dnf install -q -y git gcc-c++ cmake openssl-devel libcurl-devel libaio-devel zlib-devel epel-release
          sudo dnf config-manager --set-enabled powertools
          sudo dnf install -q -y gflags-devel snappy-devel zlib-devel bzip2-devel lz4-devel libzstd-devel nasm
          rocksdbBuildDir=$(mktemp -d "${RUNNER_TEMP}/rocksdb.XXXXXX")
          trap 'rm -rf "$rocksdbBuildDir"' EXIT
          git clone -b photon-on-6.1.2 https://github.com/data-accelerator/rocksdb.git "$rocksdbBuildDir"
          cd "$rocksdbBuildDir"
          rm -rf third-party/PhotonLibOS
          ln -s "$PHOTON_SRC_DIR" third-party/PhotonLibOS
          ./photon-auto-convert.sh
          cmake -B build -D WITH_TESTS=on -D INIT_PHOTON_IN_ENV=on -D WITH_LZ4=on -D WITH_SNAPPY=on \
            -D CMAKE_BUILD_TYPE=Debug
          cmake --build build -j `nproc`
