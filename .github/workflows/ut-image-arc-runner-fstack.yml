name: Build fstack ARC runner image

on:
  workflow_dispatch:
    inputs:
      runner_version:
        description: 'GitHub Actions Runner version'
        required: false
        default: '2.338.0'
      base_image:
        description: 'fstack build image tag or digest'
        required: false
        default: 'ghcr.io/alibaba/photon-ut-fstack:latest'
      reason:
        description: 'Why ?'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: photon-arc-runner-fstack

jobs:
  ghcr_build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .github/workflows/images/arc-runner-fstack
          push: true
          build-args: |
            RUNNER_VERSION=${{ inputs.runner_version }}
            BASE_IMAGE=${{ inputs.base_image }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:v${{ inputs.runner_version }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64
